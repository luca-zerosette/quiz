}
/* ---------- ripartire da capo (scheda Domande) ---------- */
function resetCard(){
  const nt = teams().length;
  return `<div class="card">
    <strong>Ripartire da capo</strong>
    <p class="muted">Le domande caricate restano. Si torna alla copertina, con le iscrizioni chiuse.</p>
    <button class="btn ghost" onclick="resetGame(false)">↻ Nuova partita con le stesse squadre</button>
    <button class="btn danger" onclick="resetGame(true)" ${nt ? "" : "disabled"}>🗑 Azzera tutto, squadre comprese</button>
    <p class="muted" style="margin:6px 0 0">"Nuova partita" cancella punti e risposte. "Azzera tutto" cancella anche le ${nt} squadre iscritte: i concorrenti dovranno iscriversi di nuovo.</p>
  </div>`;
}
function resetGame(withTeams){
  if (withTeams) {
    const typed = prompt(`Stai per cancellare punti, risposte e TUTTE le ${teams().length} squadre.\nPer confermare scrivi AZZERA:`);
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== "AZZERA") return alert("Non hai scritto AZZERA: non ho cancellato niente.");
  } else if (!confirm("Nuova partita: tutti i punti e tutte le risposte vengono cancellati. Domande e squadre restano. Continuare?")) return;
  const up = { "quiz/answers": null, "quiz/reveal": null, "quiz/intesa": null, "quizDraw": null, "quiz/config": { phase: "copertina", idx: 0 } };
  qs().forEach(q => { if (!q.turnOf) up[`quiz/questions/${q.id}/awarded`] = null; });
  /* le prove tornano modelli: i turni si rifanno alla prossima partita, con le squadre di allora */
  Object.entries(ST.questions || {}).forEach(([id, q]) => {
    if (q.turnOf) { up[`quiz/questions/${id}`] = null; up[`quizSecret/${id}`] = null; }
    else if (q.expanded) up[`quiz/questions/${id}/expanded`] = null;
  });
  if (withTeams) up["quiz/teams"] = null;
  DB.ref().update(up).then(() => { tab = "Gioco"; render(); });
}

/* avvia una domanda da zero: niente risposte o soluzioni rimaste da prima */
async function goQ(i){
  let l = qs(); if (!l.length) return;
  i = Math.min(Math.max(i, 0), l.length - 1);
  /* una prova si trasforma nei turni delle squadre appena si avvia, così vale per chi c'è in quel momento */
  if (l[i].template) {
    if (!await expandTrials(l[i])) return;
    for (let k = 0; k < 40 && qs()[i]?.template; k++) await new Promise(r => setTimeout(r, 50));
    l = qs();
    if (l[i]?.template) return;
  }
  const up = { "quiz/config": {phase: "domanda", idx: i, start: TS, clueAt: TS, clues: 1, secs: qSecs(l[i])} };
  up["quiz/reveal/" + l[i].id] = null;
  up["quiz/intesa/" + l[i].id] = null;
  up["quizDraw/" + l[i].id] = null;
  teams().forEach(t => up[`quiz/answers/${t.id}/${l[i].id}`] = null);
  return DB.ref().update(up);
}
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
/* prove pratiche: un turno per squadra confermata, in ordine casuale, con parole estratte a caso e mai ripetute.
   Nell'intesa ogni squadra riceve la stessa quantità di parole */
async function expandTrials(q){
  const words = shuffle(arr((SECRET[q.id] || {}).words)), tl = shuffle(teams().filter(t => t.confirmed));
  if (!tl.length) return false;
  const per = q.type === "intesa" ? Math.max(1, Math.floor(words.length / tl.length)) : 1;
  const turns = Math.min(tl.length, Math.floor(words.length / per));
  if (turns < tl.length && !confirm(`Nel Word ci sono solo ${words.length} parole per ${tl.length} squadre: ${tl.length - turns} squadre resteranno senza prova. Continuare?`)) return false;
  const up = { [`quiz/questions/${q.id}/expanded`]: true };
  tl.slice(0, turns).forEach((t, k) => {
    const id = q.id + "t" + k, w = words.slice(k * per, (k + 1) * per);
    up[`quiz/questions/${id}`] = { order: q.order + (k + 1) / 1000, round: q.round, type: q.type, text: q.text, cat: q.cat || "",
      points: q.points, secs: q.secs, team: t.id, turnOf: q.id, nwords: w.length, ...(q.draw ? { draw: true } : {}) };
    up[`quizSecret/${id}`] = { answer: w.join(", "), words: w };
  });
  await DB.ref().update(up);
  return true;
}
function award(tid){
  const q = curQ();
  const on = q.awarded?.[tid];
  DB.ref("quiz/questions/" + q.id + "/awarded/" + tid).set(on ? null : ptsNow(q));
}
function awardRight(){
  const q = curQ(), up = {};
  teams().filter(t => t.confirmed && isRight(q, ST.answers?.[t.id]?.[q.id]?.value))
    .forEach(t => up[`quiz/questions/${q.id}/awarded/${t.id}`] = ptsNow(q));
  if (Object.keys(up).length) DB.ref().update(up);
}
function clearBuzz(){
  const q = curQ(), up = {};
  teams().forEach(t => up[`quiz/answers/${t.id}/${q.id}`] = null);
  up["quiz/config/clueAt"] = TS;
  return DB.ref().update(up);
}
/* nuovo indizio: le prenotazioni si azzerano e il valore della domanda scende */
function nextClue(){
  const q = curQ(), c = cfg();
  if (tooFast("clue") || c.phase !== "domanda" || (c.clues || 1) >= clueCount(q)) return;
  const up = { "quiz/config/clues": (c.clues || 1) + 1, "quiz/config/clueAt": TS };
  teams().forEach(t => up[`quiz/answers/${t.id}/${q.id}`] = null);
  DB.ref().update(up);
}
function showHint(){ const q = curQ(); DB.ref(`quiz/reveal/${q.id}/hint`).set((SECRET[q.id] || {}).hint || ""); }
function showSol(){
  const q = curQ(), sec = SECRET[q.id] || {};
  const up = {};
  up[`quiz/reveal/${q.id}/answer`] = sec.answer || "";
  up[`quiz/reveal/${q.id}/correct`] = sec.correct ?? -1;
  up[`quiz/reveal/${q.id}/notes`] = sec.notes || "";
  up["quiz/config/phase"] = "soluzione";
  /* le risposte esatte prendono i punti da sole; il presentatore può sempre toglierli o darne altri */
  teams().filter(t => t.confirmed && !q.awarded?.[t.id] && isRight(q, ST.answers?.[t.id]?.[q.id]?.value))
    .forEach(t => up[`quiz/questions/${q.id}/awarded/${t.id}`] = ptsNow(q));
  /* intesa: sul proiettore tutte le parole, segnate se indovinate, e i punti alla squadra di turno */
  if (q.type === "intesa") {
    up[`quiz/reveal/${q.id}/words`] = arr(sec.words);
    if (q.team && ptsNow(q) && !q.awarded?.[q.team]) up[`quiz/questions/${q.id}/awarded/${q.team}`] = ptsNow(q);
  }
  DB.ref().update(up);
}

/* ---------- LAVAGNA: il tablet su cui si disegna nelle prove di disegno ---------- */
/* i tratti stanno in quizDraw/<domanda>/<tratto> = { c: colore, w: spessore, p: "x,y x,y …" } su un foglio 4:3 di 1000×750:
   un nodo a parte, così mentre si disegna non si ridisegnano le pagine di telefoni e presentatore */
const DRAW_W = 1000, DRAW_H = 750;
const DRAW_COLORS = ["#111111", "#e63b2e", "#2a74d6", "#1e8e4e", "#f6c324", "#8e44ad"];
let DRAW = {};
const isDrawTurn = q => !!(q && q.draw && q.team);
/* i nomi dei tratti iniziano con l'ora in base 36: in ordine alfabetico sono anche in ordine di tempo */
const strokesOf = (qid, extra) => Object.entries({ ...(DRAW[qid] || {}), ...(extra || {}) }).sort(([a], [b]) => a < b ? -1 : 1).map(([, s]) => s);
function paint(canvas, strokes){
  if (!canvas) return;
  const box = canvas.parentElement.getBoundingClientRect();
  const scale = Math.min(box.width / DRAW_W, box.height / DRAW_H), dpr = window.devicePixelRatio || 1;
  const W = Math.max(1, Math.round(DRAW_W * scale)), H = Math.max(1, Math.round(DRAW_H * scale));
  if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; }
  const g = canvas.getContext("2d");
  g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  g.fillStyle = "#fff"; g.fillRect(0, 0, DRAW_W, DRAW_H);
  g.lineCap = g.lineJoin = "round";
  strokes.forEach(st => {
    const pts = String(st.p || "").split(" ").filter(Boolean).map(t => t.split(",").map(Number));
    if (!pts.length) return;
    g.strokeStyle = st.c || "#111"; g.lineWidth = st.w || 6;
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    pts.forEach(([x, y]) => g.lineTo(x, y));
    if (pts.length === 1) g.lineTo(pts[0][0] + .1, pts[0][1]);
    g.stroke();
  });
}
const drawProj = () => paint(document.getElementById("pjCanvas"), strokesOf(curQ()?.id));

let pen = { stroke: null, key: "", qid: "", last: 0, lastPt: null, color: DRAW_COLORS[0], erase: false };
const boardActive = () => isDrawTurn(curQ()) && cfg().phase === "domanda";
const boardPaint = () => paint(document.getElementById("bCanvas"), strokesOf(curQ()?.id, pen.stroke ? { [pen.key]: pen.stroke } : null));
/* la pagina si costruisce una volta sola: ridisegnarla a ogni aggiornamento interromperebbe il tratto in corso */
function viewBoard(){
  const app = document.getElementById("app");
  if (!document.getElementById("bCanvas")) {
    app.innerHTML = `<div class="board"><div class="board-bar"><span id="bInfo"></span><span class="board-word" id="bWord"></span></div>
      <div class="board-tools">${DRAW_COLORS.map(col => `<button class="board-col" style="background:${col}" data-c="${col}" onclick="boardTool('${col}')" aria-label="colore"></button>`).join("")}
        <button class="btn ghost" data-c="erase" onclick="boardTool('erase')">Gomma</button>
        <button class="btn danger" onclick="boardClear()">Cancella tutto</button></div>
      <div class="board-area"><canvas id="bCanvas"></canvas></div></div>`;
    setupBoard(document.getElementById("bCanvas"));
  }
  const q = curQ(), on = boardActive();
  document.getElementById("bInfo").innerHTML = on
    ? `Tocca a <strong>${h(teamName(q.team))}</strong>: disegna! <span class="tag">⏱ <span class="tick"></span></span>`
    : isDrawTurn(q) ? "Tempo finito: aspetta il prossimo turno."
    /* se la lavagna resta spenta deve essere chiaro perché */
    : q && cfg().phase === "domanda" ? `La domanda in corso ("${h(roundOf(q).title || q.text)}") non è una prova di disegno: la lavagna si accende solo nelle manche con <strong>TIPO: disegno</strong> nel Word.`
    : "La lavagna si attiva durante le prove di disegno.";
  /* la parola, piccola in un angolo: la legge chi disegna */
  document.getElementById("bWord").textContent = on ? "Parola: " + ((SECRET[q.id] || {}).answer || "") : "";
  document.querySelector(".board").classList.toggle("off", !on);
  document.querySelectorAll(".board-tools [data-c]").forEach(b => b.classList.toggle("sel", pen.erase ? b.dataset.c === "erase" : b.dataset.c === pen.color));
  if (!on) pen.stroke = null;
  boardPaint();
}
function boardTool(c){
  pen.erase = c === "erase";
  if (!pen.erase) pen.color = c;
  viewBoard();
}
function boardClear(){
  const q = curQ();
  if (q && confirm("Cancellare tutto il disegno?")) DB.ref("quizDraw/" + q.id).remove();
}
function setupBoard(cv){
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * DRAW_W), Math.round((e.clientY - r.top) / r.height * DRAW_H)]; };
  cv.addEventListener("pointerdown", e => {
    if (!boardActive()) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    pen.qid = curQ().id;
    pen.key = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    pen.lastPt = pos(e);
    pen.stroke = { c: pen.erase ? "#ffffff" : pen.color, w: pen.erase ? 40 : 7, p: pen.lastPt.join(",") };
    boardPaint(); boardSend(true);
  });
  cv.addEventListener("pointermove", e => {
    if (!pen.stroke) return;
    (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(ev => {
      const pt = pos(ev);
      /* punti troppo vicini non servono e appesantiscono il tratto */
      if (Math.abs(pt[0] - pen.lastPt[0]) + Math.abs(pt[1] - pen.lastPt[1]) < 3) return;
      pen.lastPt = pt;
      pen.stroke.p += " " + pt.join(",");
    });
    boardPaint(); boardSend(false);
  });
  const end = () => { if (!pen.stroke) return; boardSend(true); pen.stroke = null; };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
}
/* il tratto in corso parte al massimo 10 volte al secondo; alla fine si manda sempre l'ultima versione */
function boardSend(now){
  const t = Date.now();
  if (!pen.stroke || (!now && t - pen.last < 100)) return;
  pen.last = t;
  DB.ref(`quizDraw/${pen.qid}/${pen.key}`).set({ ...pen.stroke });
}
if (IS_PROJ || IS_BOARD) DB.ref("quizDraw").on("value", s => { DRAW = s.val() || {}; IS_BOARD ? boardPaint() : drawProj(); });
if (IS_BOARD) addEventListener("resize", boardPaint);

/* ---------- PROIETTORE ---------- */
function viewProj(){
  const c = cfg(), q = curQ(), ph = c.phase;
  /* la classifica nell'angolo c'è solo con CLASSIFICA: sempre */
  /* a posizioni, durante una manche, l'angolo mostra la classifica della manche in corso */
  const lr = liveRound();
  const corner = boardSetting() !== "sempre" ? "" : `<div class="pj-board comic-box"><h3>${lr ? h(roundOf(q).title) : "Classifica"}</h3>${(lr ? roundRanked(lr) : ranked()).map(t => `<div><span>${h(t.name)}</span><strong>${t.pts}</strong></div>`).join("") || "<div>Nessuna squadra</div>"}</div>`;
  const fs = (soundOn() ? "" : `<button class="pj-snd" onclick="unlockSound()">🔇 Clicca qui per attivare il suono</button>`)
    + (document.fullscreenElement ? "" : `<button class="pj-fs" onclick="document.documentElement.requestFullscreen()">schermo intero</button>`);
  const full = (id, cap) => `<div class="pj-full">${img(id)}${cap ? `<div class="pj-cap">${h(cap)}</div>` : ""}</div>`;
  /* prima delle iscrizioni: solo la copertina, niente QR né classifica */
  if (ph === "copertina") return (ST.settings?.cover ? full(ST.settings.cover) : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(quizName())}</div></div></div>`) + fs;
  if (ph === "iscrizione") {
    const names = teams().map(t => `<span>${h(t.name)}${t.confirmed ? " ✓" : ""}</span>`).join("");
    return `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(quizName())}</div>
      <div class="pj-tag">Inquadra il codice per iscrivere la tua squadra</div><div class="qr" data-qr="${h(link("p=1"))}" data-size="320"></div>
      <div class="pj-teams">${names}</div></div></div>` + fs;
  }
  if (ph === "fine") return ST.settings?.end ? full(ST.settings.end) + fs : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">Grazie per aver giocato!</div></div></div>` + fs;
  if (ph === "classifica") return `<div class="pj"><div class="pj-center"><div class="pj-pod">${podium("", "🏆 Classifica finale", "", c.shown)}</div></div></div>` + fs;
  if (ph === "parziale" && q) return `<div class="pj"><div class="pj-center">${partial(q, "", c.shown, (a, b) => `<div class="pj-pods"><div class="pj-pod">${a}</div><div class="pj-pod">${b}</div></div>`, a => `<div class="pj-pod">${a}</div>`)}</div></div>` + fs;
  if (!q || ph === "attesa") return (ST.settings?.cover ? full(ST.settings.cover) : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(quizName())}</div></div></div>`) + corner + fs;
  const r = roundOf(q);
  if (ph === "intro") return (r.cover ? full(r.cover, r.title) : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(r.title)}</div></div></div>`) + fs;

  const rv = reveal(q);
  const cl = c.clues || 1;
  const inRound = qs().filter(x => x.round === q.round);
  const pos = inRound.findIndex(x => x.id === q.id) + 1;
  /* con gli indizi a immagini si vedono solo quelle già svelate (tutte con la soluzione) */
  const shown = imgClues(q) ? qImgs(q).slice(0, rv.answer ? qImgs(q).length : cl) : qImgs(q);
  const imgs = shown.length ? `<div class="pj-imgs ${shown.length === 1 ? "one" : ""}">${shown.map(id => img(id)).join("")}</div>` : "";
  const opts = qOpts(q).length ? `<div class="pj-opts ${qOpts(q).some(o => o.length > 60) ? "long" : ""}">${qOpts(q).map((o,i) =>
    `<div class="pj-opt ${rv.answer ? (i === rv.correct ? "right" : "dim") : ""}" style="${optStyle(i)}">${LETTERS[i]}) ${h(o)}</div>`).join("")}</div>` : "";
  const clues = q.type === "indizi" ? `${qClues(q).length ? `<ul class="pj-clues">${qClues(q).slice(0, rv.answer ? qClues(q).length : cl).map((x,i) => `<li><b>${i+1}</b>${h(x)}</li>`).join("")}</ul>` : ""}
    ${rv.answer ? "" : `<div>Vale <strong>${ptsNow(q)}</strong> punti · indizio ${cl} di ${clueCount(q)}</div>`}` : "";
  const bz = isBuzz(q) && !rv.answer ? buzzes(q) : [];
  const buzz = bz.length ? `<div class="pj-buzz">🔔 ${bz.map((t,i) => i ? h(t.name) : `<strong>${h(t.name)}</strong>`).join(" · ")}</div>` : "";
  const hint = rv.hint && !rv.answer ? `<div class="pj-box pj-hint">💡 ${h(rv.hint)}</div>` : "";
  /* nelle domande a scelta l'opzione giusta è già evidenziata: basta la lettera */
  const solText = q.type === "scelta" && rv.correct >= 0 ? "Risposta " + LETTERS[rv.correct] : rv.answer;
  const sol = q.type === "intesa" ? "" : rv.answer ? `<div class="pj-box pj-sol">✅ ${h(solText)}${rv.notes ? `<div class="n">${h(rv.notes)}</div>` : ""}</div>` : "";
  /* prove: chi è di turno; nell'intesa il contatore e, a turno finito, le parole */
  const turn = q.team ? `<div class="pj-turn">Tocca a: <strong>${h(teamName(q.team))}</strong></div>` : "";
  let intesa = "";
  if (q.type === "intesa") {
    const s = intesaState(q), rw = arr(rv.words);
    intesa = rw.length
      ? `<div class="pj-words">${rw.map((w,i) => `<span class="${s.ok.includes(i) ? "ok" : ""}">${s.ok.includes(i) ? "✓ " : ""}${h(w)}</span>`).join("")}</div>
         <div class="pj-box pj-sol">${s.ok.length} ${s.ok.length === 1 ? "parola indovinata" : "parole indovinate"}: +${ptsNow(q)} ${ptsNow(q) === 1 ? "punto" : "punti"}</div>`
      : `<div class="pj-count">${s.ok.length}<small> / ${Number(q.nwords) || 0} parole indovinate</small></div>`;
  }
  const left = remaining();
  const timer = ph === "domanda" && qSecs(q) ? `<span class="pj-timer tick">${left === null ? "" : Math.max(0, Math.ceil(left / 1000)) + " s"}</span>` : ph === "risposte" && !rv.answer ? `<span class="pj-timer">Tempo!</span>` : "";
  return `<div class="pj ${corner ? "" : "wide"}"><div class="pj-top"><span class="pj-tag">${h(r.title || "")} · ${pos}/${inRound.length}</span>${timer}</div>
    <div class="pj-main comic-box">
      ${q.cat ? `<div class="pj-cat">${h(q.cat)}</div>` : ""}
      <div class="pj-q ${q.text.length > 110 ? "long" : ""}">${h(q.text)}</div>
      ${turn}${isDrawTurn(q) ? `<div class="pj-draw"><canvas id="pjCanvas"></canvas></div>` : ""}${imgs}${opts}${clues}${intesa}${buzz}${hint}${sol}
    </div></div>` + corner + fs;
}

/* ---------- CONCORRENTE: pulsantiera ---------- */
const WAIT_MSGS = [
  "🧠 Siete dentro! Fate stretching ai neuroni: si parte tra poco.",
  "📚 Iscrizione ricevuta! Ripassate le tabelline, tra poco si fa sul serio.",
  "😎 Ci siete! Il cervellone vi sta già giudicando… si parte a breve.",
  "🤫 Squadra registrata. Ultima occasione per cercare tutto su Google: tra poco non si potrà più."
];
/* scelta casuale ma fissa per squadra: la pagina si ridisegna spesso e il messaggio non deve cambiare ogni volta */
const pick = (list, key) => list[[...String(key)].reduce((n, c) => (n * 31 + c.charCodeAt(0)) >>> 0, 0) % list.length];
function viewPlayer(){
  const me = myTeam && ST.teams?.[myTeam];
  const c = cfg();
  if ((!myTeam || !me) && c.phase === "copertina") return `<div class="card" style="text-align:center"><p class="big">⏳ Le iscrizioni non sono ancora aperte</p><p>Tra poco il presentatore le apre: questa pagina si aggiorna da sola.</p></div>`;
  if (!myTeam || !me) return bookingForm();
  const head = `<div class="card"><strong>${h(me.name)}</strong></div>`;
  const wait = t => head + `<div class="card" style="text-align:center"><p>${t}</p></div>`;
  if (!me.confirmed) return wait(pick(WAIT_MSGS, myTeam));
  if (["copertina", "iscrizione", "attesa"].includes(c.phase)) return wait("✅ Squadra confermata! Attendi l'inizio del quiz.");
  if (c.phase === "classifica" || c.phase === "fine") return podium(myTeam, "🏆 Classifica finale", "", c.phase === "fine" ? null : c.shown);
  const q = curQ();
  if (!q) return wait("In attesa della prima domanda.");
  if (c.phase === "parziale") return partial(q, myTeam, c.shown, (a, b) => a + b, a => a);
  if (c.phase === "intro") return wait(`Sta per iniziare: <strong>${h(roundOf(q).title || "")}</strong>`);
  const mine = ST.answers?.[myTeam]?.[q.id]?.value;
  if (c.phase === "risposte") return head + `<div class="card" style="text-align:center"><p class="big">👀 Tempo scaduto!</p><p>Occhi sul proiettore…</p>${mine && !isBuzz(q) ? `<p class="muted">La vostra risposta: <strong>${h(mine)}</strong></p>` : ""}</div>`;
  if (c.phase === "soluzione") {
    const got = q.awarded?.[myTeam], rv = reveal(q);
    return head + `<div class="card" style="text-align:center">
      ${got ? `<p class="big">🎉 +${awardVal(q, got)} punti!</p>` : `<p class="big">😅 Niente punti stavolta</p>`}
      ${rv.answer ? `<p class="muted">Risposta giusta: <strong>${h(rv.answer)}</strong></p>` : ""}
    </div>${boardSetting() === "sempre" ? `<div class="card"><strong>${liveRound() ? "Manche: " + h(roundOf(q).title) : "Classifica"}</strong>${board(myTeam, liveRound())}</div>` : ""}`;
  }
  const r = remaining();
  const locked = c.phase !== "domanda" || (r !== null && r <= 0);
  const dis = locked ? "disabled" : "";
  const timer = qSecs(q) ? `<div class="tag" style="font-size:1.1rem">⏱ <span class="tick"></span></div>` : "";
  let pad;
  const mineTurn = q.team === myTeam;
  if (q.type === "intesa") {
    const s = intesaState(q);
    pad = mineTurn ? `<p class="big">🗣 Tocca a voi!</p><p>Indovinate le parole che vi descrive il vostro compagno.</p><p class="big">${s.ok.length} indovinate</p>`
      : `<p class="big">Tocca a ${h(teamName(q.team))}</p><p>Occhi sul proiettore e silenzio: niente suggerimenti!</p>`;
  } else if (q.type === "prova" && mineTurn) {
    pad = `<p class="big">🎭 Tocca a voi!</p><p>Il vostro concorrente va dal presentatore a sentire la parola. Le altre squadre devono indovinarla: voi non potete prenotarvi.</p>`;
  } else if (isBuzz(q)) {
    const info = q.type === "indizi" ? `<p class="muted">Indizio ${c.clues || 1} di ${clueCount(q)} · vale ${ptsNow(q)} punti</p>`
      : q.type === "prova" ? `<p>Si esibisce <strong>${h(teamName(q.team))}</strong>: indovinate!</p>` : "";
    pad = info + (mine ? `<p class="big">✅ Sei prenotato: rispondi a voce!</p>`
      : `<button class="btn big-opt" ${dis} onclick="answer('Prenotato')">🔔 PRENOTATI</button>`);
  } else if (q.type === "scelta") {
    pad = qOpts(q).map((o,i) =>
      `<button class="big-opt" style="${optStyle(i)};font-size:1.3rem;padding:24px;font-weight:600;border-radius:12px;text-align:left;border:${mine===o?'4px solid #000':'0'};opacity:${dis?'.5':'1'}" ${dis} data-v="${h(o)}" onclick="answer(this.dataset.v)">${LETTERS[i]}) ${h(o)}</button>`).join("");
  } else {
    pad = `<input id="pAns" placeholder="La tua risposta" ${dis}>
      <button class="btn big-opt" ${dis} onclick="answer(document.getElementById('pAns').value)">Invia risposta</button>`;
  }
  const sent = mine && !isBuzz(q) ? `<p>Inviata: <strong>${h(mine)}</strong></p>` : "";
  return head + `<div class="card" style="text-align:center">${timer}${sent}${pad}</div>`;
}
function answer(v){
  v = String(v ?? "").trim();
  const r = remaining();
  /* la pagina potrebbe essere ancora quella vecchia: a tempo scaduto la risposta non parte */
  if (!v || cfg().phase !== "domanda" || (r !== null && r <= 0) || !ST.teams?.[myTeam]?.confirmed) return;
  /* nelle prove la squadra di turno non risponde, e nell'intesa non risponde nessuno dal telefono */
  const q = curQ();
  if (q.team === myTeam || q.type === "intesa") return;
  DB.ref(`quiz/answers/${myTeam}/${q.id}`).set({value: v.slice(0, 200), t: TS});
}
function bookingForm(){
  return `<div class="card">
    <strong>Iscrivi la tua squadra</strong>
    <input id="bName" placeholder="Nome squadra" maxlength="30">
    <input id="bMem" placeholder="Membri (facoltativo)" maxlength="80">
    <button class="btn" onclick="book()">Iscriviti</button>
    <p class="muted">Avete già una squadra ma avete cambiato telefono? Scrivete lo stesso nome per rientrare.</p>
  </div>`;
}
function book(){
  const name = document.getElementById("bName").value.trim().slice(0, 30);
  if (!name || cfg().phase === "copertina") return;
  /* stesso nome = stessa squadra: chi ricarica o cambia telefono rientra invece di creare un doppione */
  const same = teams().find(t => norm(t.name) === norm(name));
  if (same) {
    if (!confirm(`La squadra "${same.name}" esiste già. Siete voi? OK per rientrare, Annulla per scegliere un altro nome.`)) return;
    myTeam = same.id;
    localStorage.setItem("qnTeam", same.id);
    return render();
  }
  const id = uid();
  DB.ref("quiz/teams/" + id).set({ name, members: document.getElementById("bMem").value.trim().slice(0, 80), confirmed: false });
  myTeam = id;
  localStorage.setItem("qnTeam", id);
}

/* ---------- QR ---------- */
function makeQR(){
  document.querySelectorAll("[data-qr]").forEach(el => {
    el.innerHTML = "";
    if (typeof QRCode === "undefined") { el.textContent = "QR non disponibile"; return; }
    const s = Number(el.dataset.size) || 220;
    new QRCode(el, { text: el.dataset.qr, width: s, height: s });
  });
}

render();
</script>
